services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENV:-Development}
      - ASPNETCORE_URLS=http://+:8000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME:-alumni_db};Username=${DB_USER:-alumni_user};Password=${DB_PASSWORD:-alumni_password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: alumni_db
    environment:
      POSTGRES_DB: ${DB_NAME:-alumni_db}
      POSTGRES_USER: ${DB_USER:-alumni_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alumni_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alumni_user} -d ${DB_NAME:-alumni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
